<!DOCTYPE html>
<html><head><style>
  @page { size: letter; margin: 0.5in }
  @layer theme, base, utilities;
  @layer theme {
    :root, :host {
      --spacing: 0.25rem;
      --color-blue-600: oklch(54.6% 0.245 262.881);
      --color-gray-100: oklch(96.7% 0.003 264.542);
      --color-gray-500: oklch(55.1% 0.027 264.364);
      --text-sm: 0.875rem; --text-sm--line-height: calc(1.25 / 0.875);
      --text-2xl: 1.5rem; --text-2xl--line-height: calc(2 / 1.5);
      --font-weight-bold: 700;
    }
  }
  @layer base {
    *, ::after, ::before, ::backdrop, ::file-selector-button { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid }
    html, :host { line-height: 1.5; font-family: sans-serif }
  }
  @layer utilities {
    .p-6 { padding: calc(var(--spacing) * 6) }
    .mt-4 { margin-top: calc(var(--spacing) * 4) }
    .px-3 { padding-inline: calc(var(--spacing) * 3) }
    .py-1 { padding-block: calc(var(--spacing) * 1) }
    .bg-gray-100 { background-color: var(--color-gray-100) }
    .bg-blue-600 { background-color: var(--color-blue-600) }
    .text-white { color: #fff }
    .text-gray-500 { color: var(--color-gray-500) }
    .text-2xl { font-size: var(--text-2xl); line-height: var(--tw-leading, var(--text-2xl--line-height)) }
    .text-sm { font-size: var(--text-sm); line-height: var(--tw-leading, var(--text-sm--line-height)) }
    .font-bold { --tw-font-weight: var(--font-weight-bold); font-weight: var(--font-weight-bold) }
    .inline-block { display: inline-block }
  }
</style></head><body>
  <div class="p-6 bg-gray-100">
    <div class="text-2xl font-bold">Invoice #1042</div>
    <div class="text-sm text-gray-500">Due October 31, 2026</div>
    <div class="mt-4"><span class="inline-block px-3 py-1 bg-blue-600 text-white font-bold text-sm">PAID</span></div>
  </div>
</body></html>
