<!DOCTYPE html>
<html><head><style>
  @page { size: letter; margin: 0.5in }

inline in a line of text.</div>
<div class="row blue">Blue, no xmlns:

<svg viewBox="0 0 24 24" fill="currentColor" style="width:48px"><path d="M12 2l3 7h7l-6 5 2 8-6-4-6 4 2-8-6-5h7z"/></svg> after
