<!DOCTYPE html>
<html>
<head>
<style>
  @page { size: letter; margin: 0.5in }
  * { box-sizing: border-box }
  body { margin: 0; font-family: sans-serif; color: #0f172a }
  @property --tw-border-style { syntax: "*"; inherits: false; initial-value: solid }
  @property --tw-ring-color { syntax: "*"; inherits: false; initial-value: #93c5fd }
  @property --tw-ring-shadow { syntax: "*"; inherits: false; initial-value: 0 0 #0000 }
  @property --tw-shadow-color { syntax: "*"; inherits: false; initial-value: #0000 }
  @property --tw-shadow { syntax: "*"; inherits: false; initial-value: 0 0 #0000 }
  .card {
    --tw-ring-shadow: 0 0 0 3px var(--tw-ring-color);
    width: 360px;
    padding: 24px;
    border-width: 1px;
    border-style: var(--tw-border-style);
    border-color: #cbd5e1;
    border-radius: 10px;
    background: white;
    box-shadow: var(--tw-ring-shadow), var(--tw-shadow);
  }
  .eyebrow { color: #2563eb; font-size: 12px; font-weight: bold; text-transform: uppercase }
  .title { margin-top: 8px; font-size: 24px; font-weight: bold }
  .copy { margin-top: 10px; color: #475569; line-height: 1.5 }
  .badge { display: inline-block; margin-top: 16px; padding: 5px 10px; border-radius: 6px; background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: bold }
</style>
</head>
<body>
  <article class="card">
    <div class="eyebrow">Tailwind v4</div>
    <div class="title">Registered design tokens</div>
    <div class="copy">Border, ring, and shadow defaults come from the emitted --tw-* registrations.</div>
    <div class="badge">Ready to render</div>
  </article>
</body>
</html>
