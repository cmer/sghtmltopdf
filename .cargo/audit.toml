# cargo-audit の設定。CIは `--deny warnings` で走らせるので、
# ここに挙げていないアドバイザリが1件でも出ればビルドが落ちる。
#
# 既知のものを黙って通すのではなく、判断した上でIDを明記して無視する。
# 新しいアドバイザリが増えたときだけ気づけるようにするための運用。
#
# 現時点で無視しているアドバイザリは無い。
# (rustybuzz / ttf-parser のメンテナンス終了に伴う RUSTSEC-2026-0206 /
#  RUSTSEC-2026-0192 は、harfrust / skrifa への移行と fontdb 0.24 への
#  更新で依存自体が消えたため、ignoreの必要がなくなった)

[advisories]
ignore = []
