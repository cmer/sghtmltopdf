# cargo-audit の設定。CIは `--deny warnings` で走らせるので、
# ここに挙げていないアドバイザリが1件でも出ればビルドが落ちる。
#
# 既知のものを黙って通すのではなく、判断した上でIDを明記して無視する。
# 新しいアドバイザリが増えたときだけ気づけるようにするための運用。

[advisories]
ignore = [
    # rustybuzz / ttf-parser がメンテナンス終了(2026-06〜07)。
    #
    # どちらもフォントのシェイピングとパースに使っており、信頼できない
    # フォントバイナリを直接読む層にあたるため、脆弱性が出ても上流の修正は
    # 期待できない。とはいえ現時点で既知の脆弱性は無く、代替(harfrust等)
    # への移行はレンダリング結果の互換性検証を伴うため即座には行えない。
    #
    # 当面は「フォントの読み込み経路をアクセス制御下に置く」ことで
    # 攻撃面を絞る方針(`core/src/fonts/face.rs` は `ImageFetcher` 経由)。
    # 移行の可否は別途検討する。
    "RUSTSEC-2026-0206", # rustybuzz is unmaintained
    "RUSTSEC-2026-0192", # ttf-parser is unmaintained
]
