<!DOCTYPE html>
<html><head><style>
  @page { size: letter; margin: 0.5in }
  * { margin: 0; padding: 0 }
  body { font-family: serif; font-size: 16px; color: #000 }
  p { width: 600px; margin-top: 60px }
  blockquote { position: relative; width: 400px; margin-top: 120px; padding: 16px; background: #eef }
blockquote p { width: auto; margin-top: 0 }
blockquote::before { content: "\201C"; position: absolute; top: -70px; right: 25px; font-size: 82px; color: #ccc; transform: scale(-1) }
</style></head><body><blockquote><p>Simplicity is prerequisite for reliability.</p><p>Edsger W. Dijkstra</p></blockquote></body></html>
