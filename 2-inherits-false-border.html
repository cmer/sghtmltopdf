<!DOCTYPE html>
<html>
<head>
<style>
  @page { size: letter; margin: 0.5in }
  * { box-sizing: border-box }
  body { margin: 0; font-family: sans-serif }
  @property --tw-border-style { syntax: "*"; inherits: false; initial-value: solid }
  .border-none { --tw-border-style: none; padding: 12px; background: #f3f4f6 }
  .border { border-style: var(--tw-border-style); border-width: 4px; border-color: #2563eb; width: 220px; height: 56px; padding: 12px }
</style>
</head>
<body><div class="border-none"><div class="border">Child border</div></div></body>
</html>
