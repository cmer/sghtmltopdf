[package]
name = "sghtmltopdf-core"
version = "0.1.0"
edition = "2021"
description = "PDF rendering engine that is not depend on Chromium/WebKit/Gecko"

[lib]
name = "sghtmltopdf_core"
path = "src/lib.rs"

[[bin]]
name = "sghtmltopdf"
path = "src/main.rs"
required-features = ["cli"]

# HTTPサーバモードのE2Eテストは`server` featureが要る
# (`--no-default-features --features cli`でのテストから除外するため)。
[[test]]
name = "server"
required-features = ["server"]

# CLI(clap)とHTTPサーバ(tiny_http)はfeatureで切り離す。ライブラリとして
# 使う側は`--no-default-features`でこれらを引き込まずに済む
# (docs/decisions/0055-cli-design.md 決定1)。
#
# `cli`と`server`が分かれているのはRuby binding(M14)のため。gemは
# オプション解釈のためにclap(=`cli`)を使うが、HTTPサーバは要らない
# (docs/decisions/0062-ruby-binding.md 決定4)。
[features]
default = ["cli", "server"]
cli = ["dep:clap"]
server = ["cli", "dep:tiny_http"]

[dependencies]
base64 = "0.22.1"
# 既定featureとの差はヘルプの色付け(anstream等6クレート)のみで実測差もほぼ
# 無いため最小構成にし、タイポ時の候補提示(suggestions)だけ足している
# (docs/decisions/0056-cli-and-server-crates.md 決定1)。
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
], optional = true }
cssparser = "0.37.0"
# `--encoding`と`<meta charset>`のデコード用(M12 T299)。実測で依存2個・
# ビルド+1.3s・サイズ+0.16MiBと軽量なため採用した。
encoding_rs = "0.8"
cssparser-color = "0.5.0"
flate2 = "1.1.9"
fontdb = "0.23.0"
html5ever = "0.39.0"
image = { version = "0.25.10", default-features = false, features = ["webp"] }
palette = { version = "0.7.6", default-features = false, features = ["std"] }
pdf-writer = "0.15.0"
png = "0.18.1"
precomputed-hash = "0.1.1"
rustybuzz = "0.20.1"
selectors = "0.39.0"
subsetter = "0.2.6"
taffy = "0.12.2"
# HTTPサーバモード(M12 Phase 7)。同期・軽量でボディを`Read`として扱える
# (docs/decisions/0056-cli-and-server-crates.md 決定2)。
tiny_http = { version = "0.12", optional = true }
ttf-parser = "0.25.1"
ureq = "3.3.0"

# krillaはT1スパイクの比較対象として examples/spike_krilla.rs でのみ使用。
# 採用はpdf-writerに決定したため本実装では使わない(docs/decisions/0001-pdf-writer-crate.md参照)
[dev-dependencies]
krilla = "0.8.2"
# HTTPサーバモードのE2Eテスト(core/tests/server.rs)でクライアントとして使う。
# 本体の依存にも同じものが入っているためビルドコストの増加はない。
ureq = "3.3.0"
