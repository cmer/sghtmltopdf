<!DOCTYPE html>
<html>
<head>
<style>
  @page { size: letter; margin: 0.5in }
  * { box-sizing: border-box }
  body { margin: 0; font-family: sans-serif }
  @property --tw-border-style { syntax: "*"; inherits: false; initial-value: solid }
  .border { border-style: var(--tw-border-style); border-width: 1px; border-color: #64748b; width: 260px; height: 64px; padding: 18px }
</style>
</head>
<body><div class="border">Tailwind border</div></body>
</html>
