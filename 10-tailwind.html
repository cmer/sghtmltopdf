<!DOCTYPE html>
<html><head><style>
  @page { size: letter; margin: 0.5in }
  * { margin: 0; padding: 0; box-sizing: border-box }
  body { font-family: sans-serif; font-size: 14px }
  .card { width: 420px; padding: 16px; background: #e5e7eb; border-radius: 8px }
  table { width: 100%; border-collapse: collapse }
  th, td { padding: 8px 12px; text-align: left }
  th { font-size: 12px; color: #6b7280 }
  .bg-gray-50 { background: #f9fafb }
  .bg-white { background: #fff }
  tbody tr + tr td { border-top: 1px solid #e5e7eb }
</style></head><body><div class="card"><table>
  <thead class="bg-gray-50"><tr><th>Name</th><th>Title</th><th>Role</th></tr></thead>
  <tbody class="bg-white">
    <tr><td>Lindsay Walton</td><td>Front-end Developer</td><td>Member</td></tr>
    <tr><td>Courtney Henry</td><td>Designer</td><td>Admin</td></tr>
    <tr><td>Tom Cook</td><td>Director of Product</td><td>Member</td></tr>
  </tbody>
</table></div></body></html>
